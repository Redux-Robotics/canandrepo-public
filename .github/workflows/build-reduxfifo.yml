name: Build ReduxFIFO

on: 
  workflow_dispatch:
  push:
    paths:
      - '.github/**'
      - 'reduxfifo/**'
      - 'ReduxLib/**'
      - 'crates/**'
      - 'canandmessage/**'

jobs:
  build-vendordep-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-name: Systemcore
            container: wpilib/systemcore-cross-debian:trixie
            build-options: "headers linuxsystemcore"
            reduxfifo-features: "systemcore"
            reduxlib-options: "-Ponlylinuxsystemcore"
          - artifact-name: LinuxArm64
            container: wpilib/aarch64-cross-debian:trixie
            build-options: "headers linuxarm64"
            reduxfifo-features: "simulation"
            reduxlib-options: "-Ponlylinuxarm64"
          - artifact-name: LinuxX86-64
            container: wpilib/systemcore-cross-debian:trixie
            build-options: "headers linuxx86-64"
            reduxfifo-features: "simulation"
            reduxlib-options: "-Pskiplinuxsystemcore"

    name: "Build Vendordep - ${{ matrix.artifact-name }}"
    runs-on: ubuntu-26.04
    container: ${{ matrix.container }}
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y build-essential libclang-dev
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Fetch all history and metadata
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: "" # just put the artifacts in the bag
          cache-key: ${{ matrix.artifact-name }}
          cache-workspaces: "crates -> crates/target\nreduxfifo -> reduxfifo/target\nreduxfifo/xtask -> reduxfifo/xtask/target"
      - name: Ensure locations of tools
        run: which rust-strip && which cargo
      - name: Build maven artifact
        run: echo "$PATH" && cd reduxfifo && cargo xtask ${{ matrix.build-options }} -- --no-default-features --features ${{ matrix.reduxfifo-features }}
      - name: Build with Gradle
        run: ./gradlew publish -PreleaseMode -Pskiplinuxarm32 ${{ matrix.reduxlib-options }}
        working-directory: ReduxLib
      - name: Upload ReduxLib artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ReduxLib-${{ matrix.artifact-name }}
          path: ReduxLib/build/repos/releases
      - name: Upload ReduxFIFO artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ReduxFIFO-${{ matrix.artifact-name }}
          path: reduxfifo/target/maven

  build-vendordep-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: Windows
            architecture: x64
            build-options: "windowsx86-64"
            reduxfifo-features: "simulation"
          - os: macos-26
            artifact-name: macOS
            architecture: aarch64
            build-options: "osxuniversal"
            reduxfifo-features: "simulation"
    name: "Build Vendordep - ${{ matrix.artifact-name }}"
    runs-on: "${{ matrix.os }}"
    steps:
      - if: runner.os == 'Windows'
        name: Workaround Windows being a bad operating system
        run: git config --system core.longpaths true
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - if: runner.os == 'macOS'
        uses: Homebrew/actions/setup-homebrew@main
      - if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: "crates -> crates/target\nreduxfifo -> reduxfifo/target\nreduxfifo/xtask -> reduxfifo/xtask/target"
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          architecture: ${{ matrix.architecture }}
      - name: Build ReduxFIFO
        run: cargo xtask headers ${{ matrix.build-options }} -- --no-default-features --features ${{ matrix.reduxfifo-features }}
        working-directory: reduxfifo
      - uses: actions/upload-artifact@v7
        with:
          name: ReduxFIFO-${{ matrix.artifact-name }}
          path: reduxfifo/target/maven
      - name: Build ReduxLib with Gradle
        run: ./gradlew publish -PreleaseMode -Pbuildalldesktop
        working-directory: ReduxLib
      - uses: actions/upload-artifact@v7
        with:
          name: ReduxLib-${{matrix.artifact-name}}
          path: ReduxLib/build/repos/releases

  combine:
    name: Combine
    needs: [build-vendordep-linux, build-vendordep-host]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - run: echo "REDUXLIB_VERSION=$(cat ReduxLib/version.txt)" >> "${GITHUB_OUTPUT}"
        id: reduxlib-version
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten Artifacts
        run: mkdir -p maven final/vendordeps ReduxLib/build/allOutputs && rsync -av --delete artifacts/*/* maven/ && mv maven final
      - name: Generate vdep json
        run: (python3 mkvdepjson.py || true) && cp build/allOutputs/* ../final/vendordeps
        working-directory: ReduxLib
      - uses: actions/upload-artifact@v7
        with:
          name: ReduxLib-offline-v${{ steps.reduxlib-version.outputs.REDUXLIB_VERSION }}-${{github.sha}}
          path: final
