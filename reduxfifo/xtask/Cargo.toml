[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["Bagholders of Redux Robotics"]
edition = "2024"
documentation = "https://github.com/Redux-Robotics/canandrepo-public"
homepage = "https://github.com/Redux-Robotics/canandrepo-public"
repository = "https://github.com/Redux-Robotics/canandrepo-public"
publish = false


[package]
name = "xtask"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = { version = "1.0.103", features = ["backtrace"] }
cargo_toml = "1"
chrono = "0.4.31"
clap = { version = "4.5.40", features = ["derive"] }
homedir = "0.3.4"
md5 = "0.8.0"
semver = "1.0.24"
sha1 = "0.11.0"
sha2 = "0.11.0"
walkdir = "2.5.0"
which = "8.0.0"
zip = { version = "8", features = ["deflate"], default-features = false }
